version: '3.8'

services:
  social:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - ./server/.env:/app/server/.env:ro
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Development service (optional)
  social-dev:
    profiles: ["dev"]
    build: .
    ports:
      - "3001:3001"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PORT=3001
    volumes:
      - ./server/.env:/app/server/.env:ro
      - ./client/src:/app/client/src
      - ./server:/app/server
    command: npm run dev 